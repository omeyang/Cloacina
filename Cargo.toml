[package]
name = "cloacina"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Cloacina: portable Linux cleanup with interactive Podman and Docker cleanup"
license = "MIT"
repository = "https://github.com/omeyang/cloacina"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
