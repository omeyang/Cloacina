name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Static binary smoke test
        run: |
          target/${{ matrix.target }}/release/cloacina --version
          target/${{ matrix.target }}/release/cloacina --help
          if readelf -l target/${{ matrix.target }}/release/cloacina | grep -q INTERP; then
            echo 'Unexpected dynamic loader' >&2
            exit 1
          fi
      - name: Isolated Podman integration tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          sudo env "PATH=$PATH" python3.12 tests/integration_podman.py \
            target/${{ matrix.target }}/release/cloacina
